<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جامعة بلس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2f6fe0;--bg2:#0b2f8f;--bg3:#061a5c;--wave:rgba(255,255,255,.07);--glass:rgba(255,255,255,.13);--glass2:rgba(255,255,255,.2);--edge:rgba(255,255,255,.34);--tx:#fff;--mut:rgba(255,255,255,.78);--pill:#cfe5ff;--pillx:#0b2f8f;--shadow:rgba(2,10,50,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg1:#dcecff;--bg2:#a9cdfb;--bg3:#7fb0f3;--wave:rgba(255,255,255,.35);--glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.7);--edge:rgba(255,255,255,.9);--tx:#0b2a6b;--mut:rgba(11,42,107,.75);--pill:#0b3fb5;--pillx:#fff;--shadow:rgba(40,80,160,.3)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]):not([data-theme=light]){--bg1:#dcecff}}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;font-family:Cairo,system-ui,sans-serif;color:var(--tx);min-height:100vh;background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-radial-gradient(ellipse 90% 60% at 20% 15%,transparent 0 22px,var(--wave) 22px 34px),repeating-radial-gradient(ellipse 80% 70% at 85% 80%,transparent 0 26px,var(--wave) 26px 38px)}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--edge);box-shadow:0 10px 34px var(--shadow),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:12px auto 0;width:min(1100px,calc(100% - 24px));border-radius:26px;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px;color:var(--tx);text-decoration:none;margin-inline-end:auto}
.mark{width:34px;height:34px;border-radius:50%;background:#fff;color:#a61c24;display:grid;place-items:center;font-weight:900;font-size:15px;border:2px solid #a61c24;flex:none}
nav a{color:var(--tx);text-decoration:none;font-weight:600;padding:6px 12px;border-radius:14px}
nav a:hover{background:var(--glass2)}
.ib,.btn{font:inherit;cursor:pointer;border:1px solid var(--edge);color:var(--tx);background:var(--glass2);border-radius:16px;padding:7px 14px;font-weight:600}
.btn.main,.pill{background:var(--pill);color:var(--pillx);border:1.5px solid rgba(6,26,92,.7);font-weight:800}
.ib:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
main{position:relative;z-index:1;width:min(1100px,calc(100% - 24px));margin:0 auto;padding:22px 0 60px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;padding:20px 10px}
.hero h1{font-size:clamp(30px,5.4vw,54px);line-height:1.25;margin:0 0 14px;font-weight:900}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:700;border-radius:30px;padding:6px 14px}
.note{justify-self:center;width:min(300px,80%);aspect-ratio:1/1.1;background:#f6f3ea;color:#1c2f6b;padding:34px 22px;transform:rotate(-3deg);box-shadow:0 14px 30px rgba(0,0,0,.35);font-family:'Aref Ruqaa',serif;font-size:22px;line-height:1.7;text-align:center;display:grid;place-items:center;position:relative}
.note:before{content:"";position:absolute;top:-16px;left:30px;width:16px;height:44px;border:3px solid #9aa3b5;border-radius:10px}
.cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
h2{font-size:28px;font-weight:900;margin:34px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.fac{border-radius:30px;padding:12px}
.fac .in{border:2px dashed rgba(255,255,255,.7);border-radius:22px;min-height:230px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
:root[data-theme=light] .fac .in{border-color:rgba(11,42,107,.45)}
.fac .mark{position:absolute;top:14px;left:14px;width:30px;height:30px;font-size:12px}
.fac h3{margin:0;font-size:34px;font-weight:900;background:linear-gradient(180deg,#fff,#9cc0ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
:root[data-theme=light] .fac h3{background:linear-gradient(180deg,#0b3fb5,#4b86e8);-webkit-background-clip:text;background-clip:text}
.fac p{margin:6px 0 0;color:var(--mut);font-size:14px}
.pill{display:inline-block;text-decoration:none;border-radius:999px;padding:12px 38px;font-size:14px;align-self:flex-start;margin-top:16px;cursor:pointer;font-family:inherit}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.feat div{border-radius:24px;padding:18px}
.feat b{display:block;font-size:18px;margin-bottom:4px}.feat span{color:var(--mut);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.tabs .ib[aria-pressed=true]{background:var(--pill);color:var(--pillx)}
.res{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:8px}
.res b{font-size:19px}.res span{color:var(--mut);font-size:14px;flex:1}
.back{color:var(--tx);font-weight:700;text-decoration:none}
footer{position:relative;z-index:1;text-align:center;color:var(--mut);padding:0 0 30px;font-size:14px}
dialog{border:0;background:none;padding:0;color:var(--tx);width:min(380px,calc(100% - 24px))}
dialog::backdrop{background:rgba(2,10,50,.55);backdrop-filter:blur(6px)}
dialog .box{border-radius:28px;padding:22px;background:var(--bg2);}
:root[data-theme=light] dialog .box{background:rgba(255,255,255,.85)}
input{width:100%;font:inherit;padding:11px 14px;margin:6px 0;border-radius:14px;border:1px solid var(--edge);background:var(--glass2);color:var(--tx)}
input::placeholder{color:var(--mut)}
.msg{min-height:22px;font-size:14px;color:#ffd54a;font-weight:600}
:root[data-theme=light] .msg{color:#b3261e}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:50;border-radius:20px;padding:12px 20px;font-weight:700}
@media(max-width:760px){.hero{grid-template-columns:1fr}.note{order:2}nav{display:none}header{padding:8px 12px}}

body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none}
:root[data-theme=light] body:after{background:rgba(236,246,255,.62)}
@keyframes drift{from{transform:scale(1) rotate(0)}to{transform:scale(1.14) rotate(2.5deg)}}
.orb{position:fixed;z-index:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(120,170,255,.08) 70%);filter:blur(2px);animation:float 14s ease-in-out infinite alternate}
.orb:nth-of-type(1){width:260px;height:260px;top:14%;left:-60px}
.orb:nth-of-type(2){width:180px;height:180px;top:58%;right:-40px;animation-duration:18s;animation-delay:-5s}
.orb:nth-of-type(3){width:120px;height:120px;bottom:8%;left:30%;animation-duration:11s}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(40px,-60px)}}
header{--tx:#fff;--glass2:rgba(255,255,255,.2);--edge:rgba(255,255,255,.34);color:#fff;background:rgba(8,36,120,.38)}
.logo img{height:34px;width:auto;display:block}
.hero{grid-template-columns:1.1fr .9fr}
.hero h1 span{display:block;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.hero h1 span:nth-child(2){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.side{display:flex;flex-direction:column;gap:18px;align-items:stretch}
.side .note{width:min(250px,70%);font-size:19px;padding:26px 18px;animation:sway 6s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(1.5deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{border-radius:22px;padding:14px 8px;text-align:center}
.stats b{display:block;font-size:30px;font-weight:900;line-height:1.1}
.stats span{font-size:13px;color:var(--mut);font-weight:600}
.strip{margin-top:26px;border-radius:20px;overflow:hidden;direction:ltr;padding:12px 0}
.tick{display:flex;width:max-content;gap:40px;animation:tick 28s linear infinite;font-weight:800;font-size:18px;white-space:nowrap}
@keyframes tick{to{transform:translateX(-50%)}}
.fac{transition:transform .35s}.fac:hover{transform:translateY(-8px)}
.pill{transition:transform .2s}.pill:hover{transform:scale(1.06)}
@media(max-width:760px){.hero{grid-template-columns:1fr}.side{order:2}.stats b{font-size:24px}}


:root{--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.14);--edge:rgba(255,255,255,.26)}
:root[data-theme=light]{--glass:rgba(255,255,255,.26);--glass2:rgba(255,255,255,.45);--edge:rgba(255,255,255,.75)}
.glass{backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);box-shadow:0 8px 30px rgba(2,10,50,.28),inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.05)}
header{background:rgba(8,36,120,.14)}
.side{display:contents}
.hero{grid-template-columns:1.15fr .85fr;grid-template-areas:"txt note" "txt stats"}
.hero>div:first-child{grid-area:txt}.note{grid-area:note;justify-self:center}.stats{grid-area:stats}
@media(max-width:760px){.hero{grid-template-columns:1.25fr .75fr;grid-template-areas:"txt note" "stats stats";gap:14px 10px;padding:10px 0}
.hero h1{font-size:26px}.side .note{width:100%;font-size:14px;padding:18px 10px;aspect-ratio:1/1.15}.note:before{left:18px;height:34px}.badge{font-size:13px}}

:root{--glass:rgba(255,255,255,.13);--glass2:rgba(255,255,255,.2);--edge:rgba(255,255,255,.34)}
:root[data-theme=light]{--glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.7);--edge:rgba(255,255,255,.9)}
.glass{backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);box-shadow:0 10px 34px var(--shadow),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08)}
header{background:rgba(8,36,120,.38)}
:root[data-theme=dark] main{text-shadow:0 1px 8px rgba(2,10,50,.35)}
.note,.pill,.toast{text-shadow:none}
.toast{background:#0b2f8f;color:#fff;border:1px solid rgba(255,255,255,.4)}
:root[data-theme=light] .toast{background:#fff;color:#0b2a6b}
.fac,.res,.stats div{position:relative;overflow:hidden}
.fac:after,.res:after,.stats div:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(120%);animation:sweep 7s ease-in-out infinite}
.fac:nth-child(2n):after{animation-delay:1.2s}.fac:nth-child(3n):after{animation-delay:2.4s}
@keyframes sweep{0%{transform:translateX(120%)}35%,100%{transform:translateX(-120%)}}
.hero h1 span:first-child{background:linear-gradient(90deg,#fff 0,#9cc7ff 45%,#fff 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s cubic-bezier(.2,.8,.2,1) both,shine 5s linear infinite}
:root[data-theme=light] .hero h1 span:first-child{background-image:linear-gradient(90deg,#0b2a6b,#3a7be8 45%,#0b2a6b 90%);background-size:200% 100%}
@keyframes shine{to{background-position:-200% 0}}
.cta .pill{position:relative}
.cta .pill:before{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid #fff;animation:ring 2.2s ease-out infinite}
:root[data-theme=light] .cta .pill:before{border-color:#0b3fb5}
@keyframes ring{from{transform:scale(.94);opacity:.9}to{transform:scale(1.18);opacity:0}}
.plus{position:fixed;bottom:-60px;z-index:0;pointer-events:none;font-weight:900;color:rgba(255,255,255,.2);animation:rise2 linear infinite}
:root[data-theme=light] .plus{color:rgba(11,63,181,.16)}
@keyframes rise2{to{transform:translateY(-115vh) rotate(180deg)}}
.rv{opacity:0;transform:translateY(28px) scale(.97);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.mark{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,255,255,.18)}}


.note{display:flex;flex-direction:column;justify-content:center;text-align:right;aspect-ratio:auto;padding:36px 24px 26px}
.note ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.note li{display:flex;align-items:center;gap:11px}
